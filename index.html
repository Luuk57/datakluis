<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Datakluis | Persoonlijk Portaal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-900 font-sans antialiased">

  <!-- ========================================================= -->
  <!-- BLOK A: INLOGSCHERM (Verborgen zodra je bent ingelogd)     -->
  <!-- ========================================================= -->
  <div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg border border-slate-200 p-8">
      <p class="text-xs font-bold uppercase tracking-wider text-blue-600">Datakluis Portaal</p>
      <h1 id="auth-title" class="text-2xl font-bold text-slate-900 mt-1">Inloggen</h1>
      <p class="text-sm text-slate-500 mt-1 mb-6">Log in met je e-mailadres of Google-account.</p>

      <div id="error-box" class="hidden mb-4 p-3 rounded-lg bg-red-50 border border-red-200 text-sm text-red-700"></div>

      <form id="email-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">E-mailadres</label>
          <input id="email-input" type="email" required placeholder="naam@voorbeeld.nl"
            class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Wachtwoord</label>
          <input id="password-input" type="password" required placeholder="Minimaal 6 tekens"
            class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
        </div>
        <button id="submit-btn" type="submit"
          class="w-full py-2.5 px-4 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm transition cursor-pointer">
          Inloggen met e-mail
        </button>
      </form>

      <div class="my-5 flex items-center gap-3">
        <div class="h-px bg-slate-200 flex-1"></div>
        <span class="text-xs text-slate-400">OF</span>
        <div class="h-px bg-slate-200 flex-1"></div>
      </div>

      <button id="google-btn" type="button"
        class="w-full py-2.5 px-4 rounded-lg bg-white hover:bg-slate-50 text-slate-800 font-medium text-sm border border-slate-300 transition cursor-pointer">
        Verder met Google
      </button>

      <div class="mt-6 text-center text-sm">
        <button id="toggle-mode-btn" type="button" class="text-blue-600 font-medium hover:underline cursor-pointer">
          Nog geen account? Maak er een aan
        </button>
      </div>
    </div>
  </div>

  <!-- ========================================================= -->
  <!-- BLOK B: DE SCHIL / HOOFDSCHERM (Zichtbaar na inloggen)    -->
  <!-- ========================================================= -->
  <div id="app-shell" class="hidden min-h-screen flex flex-col md:flex-row">
    
    <!-- Linker zijbalk met je menu -->
    <aside class="w-full md:w-64 bg-slate-900 text-white p-6 flex flex-col justify-between shrink-0">
      <div>
        <div class="pb-5 mb-6 border-b border-slate-800">
          <span class="text-xs font-bold uppercase tracking-wider text-blue-400">Datakluis</span>
          <p id="user-email-display" class="text-sm text-slate-300 truncate mt-1"></p>
        </div>

        <nav class="space-y-1.5" id="menu-buttons">
          <button data-tab="start" class="menu-btn w-full text-left px-4 py-2.5 rounded-lg text-sm font-medium bg-blue-600 text-white cursor-pointer">Start</button>
          <button data-tab="vochtintake" class="menu-btn w-full text-left px-4 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 cursor-pointer">Vochtintake</button>
          <button data-tab="ritten" class="menu-btn w-full text-left px-4 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 cursor-pointer">Ritten</button>
          <button data-tab="dialyse" class="menu-btn w-full text-left px-4 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 cursor-pointer">Dialyse</button>
          <button data-tab="brieven" class="menu-btn w-full text-left px-4 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 cursor-pointer">Brieven</button>
          <button data-tab="agenda" class="menu-btn w-full text-left px-4 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 cursor-pointer">Agenda</button>
        </nav>
      </div>

      <button id="logout-btn" class="mt-8 w-full py-2.5 px-4 rounded-lg bg-slate-800 hover:bg-red-600 text-sm text-slate-200 hover:text-white transition cursor-pointer">
        Uitloggen
      </button>
    </aside>

    <!-- Rechter werkruimte -->
    <main class="flex-1 p-6 md:p-10">
      <div class="max-w-4xl mx-auto bg-white rounded-2xl border border-slate-200 shadow-sm p-8">
        <h2 id="page-title" class="text-2xl font-bold text-slate-900">Start</h2>
        <p id="page-description" class="text-slate-600 mt-2">
          Welkom in je persoonlijke Datakluis. Kies links een onderdeel. Ritten en Dialyse koppelen we straks automatisch aan de Agenda.
        </p>
      </div>
    </main>
  </div>

  <!-- ========================================================= -->
  <!-- BLOK C: DE WERKING (Firebase & Knoppen)                   -->
  <!-- ========================================================= -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      signInWithPopup,
      GoogleAuthProvider,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBzvMLTybV4bKEWRUA2WEuye4lfNeoHfew",
      authDomain: "datakluis-695b5.firebaseapp.com",
      databaseURL: "https://datakluis-695b5-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "datakluis-695b5",
      storageBucket: "datakluis-695b5.firebasestorage.app",
      messagingSenderId: "48982908762",
      appId: "1:48982908762:web:013a61446ffc2d739f9d63"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const googleProvider = new GoogleAuthProvider();

    const loginScreen = document.getElementById('login-screen');
    const appShell = document.getElementById('app-shell');
    const errorBox = document.getElementById('error-box');
    const authTitle = document.getElementById('auth-title');
    const submitBtn = document.getElementById('submit-btn');
    const toggleModeBtn = document.getElementById('toggle-mode-btn');
    let isRegisterMode = false;

    toggleModeBtn.addEventListener('click', () => {
      isRegisterMode = !isRegisterMode;
      errorBox.classList.add('hidden');
      authTitle.textContent = isRegisterMode ? 'Account aanmaken' : 'Inloggen';
      submitBtn.textContent = isRegisterMode ? 'Account aanmaken' : 'Inloggen met e-mail';
      toggleModeBtn.textContent = isRegisterMode
        ? 'Heb je al een account? Log in'
        : 'Nog geen account? Maak er een aan';
    });

    document.getElementById('email-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.add('hidden');
      const email = document.getElementById('email-input').value;
      const password = document.getElementById('password-input').value;

      try {
        if (isRegisterMode) {
          await createUserWithEmailAndPassword(auth, email, password);
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }
      } catch (err) {
        errorBox.textContent = 'Niet gelukt: controleer je e-mailadres en wachtwoord (min. 6 tekens).';
        errorBox.classList.remove('hidden');
      }
    });

    document.getElementById('google-btn').addEventListener('click', async () => {
      errorBox.classList.add('hidden');
      try {
        await signInWithPopup(auth, googleProvider);
      } catch (err) {
        errorBox.textContent = 'Inloggen met Google is mislukt. Controleer of je domein is toegestaan in Firebase.';
        errorBox.classList.remove('hidden');
      }
    });

    document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginScreen.classList.add('hidden');
        appShell.classList.remove('hidden');
        document.getElementById('user-email-display').textContent = user.email;
      } else {
        appShell.classList.add('hidden');
        loginScreen.classList.remove('hidden');
      }
    });

    const tabTexts = {
      start: ['Start', 'Welkom in je persoonlijke Datakluis. Kies links een onderdeel.'],
      vochtintake: ['Vochtintake', 'Hier komt straks de Vochtmonitor.'],
      ritten: ['Ritten', 'Hier voer je straks je ritten in (deze komen automatisch in de Agenda).'],
      dialyse: ['Dialyse', 'Hier voer je straks je dialyses in (deze komen automatisch in de Agenda).'],
      brieven: ['Brieven', 'Hier komt straks het overzicht van je brieven.'],
      agenda: ['Agenda', 'Hier verschijnen straks al je ritten en dialyses in één overzicht.']
    };

    document.querySelectorAll('.menu-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        const tab = btn.getAttribute('data-tab');
        
        document.querySelectorAll('.menu-btn').forEach((b) => {
          b.classList.remove('bg-blue-600', 'text-white');
          b.classList.add('text-slate-300', 'hover:bg-slate-800');
        });
        btn.classList.add('bg-blue-600', 'text-white');
        btn.classList.remove('text-slate-300', 'hover:bg-slate-800');

        document.getElementById('page-title').textContent = tabTexts[tab][0];
        document.getElementById('page-description').textContent = tabTexts[tab][1];
      });
    });
  </script>
</body>
</html>
